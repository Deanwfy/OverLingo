name: Release

on:
  push:
    tags: ["v*"]
  # Builds every target without touching a release, so the pipeline can be
  # exercised before a tag exists.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One job owns the release so the parallel builds never race to create it.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      # The bundles take their version from the crate, so a tag that disagrees
      # would publish downloads whose filenames contradict what they install.
      - name: Check the tag against the crate version
        run: |
          crate=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          tag=${GITHUB_REF_NAME#v}
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $crate" >&2
            exit 1
          fi
      # The tag's own section, heading dropped: the release title already names the version.
      - name: Extract the changelog section
        run: awk '/^## \[/{n++; next} n==1' CHANGELOG.md > /tmp/release-notes.md
      - id: create
        uses: actions/github-script@v9
        with:
          script: |
            const notes = require('fs').readFileSync('/tmp/release-notes.md', 'utf8').trim()
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `OverLingo ${context.ref.replace('refs/tags/', '')}`,
              body: notes,
              draft: true,
              generate_release_notes: true,
            })
            return data.id

  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [draft, quality]
    # The dispatch runs have no draft to depend on, so that dependency is skipped
    # rather than required; `always()` means quality has to be named explicitly.
    if: always() && needs.draft.result != 'failure' && needs.quality.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-2025
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci

      # An unset secret still arrives as an empty string, which the bundler takes
      # for a certificate and dies importing, so the check has to be explicit.
      - name: Require a signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "::error::macOS builds need APPLE_CERTIFICATE"; exit 1; }

      # Bundles built without it carry no signature, and an installed copy rejects an
      # unsigned update — which only shows up once users are already on that release.
      - name: Require an updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::builds need TAURI_SIGNING_PRIVATE_KEY"; exit 1; }

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: --target ${{ matrix.target }}
          # The manifest must name the NSIS setup: the default MSI cannot take over an
          # NSIS install, and that is the download most people take.
          updaterJsonPreferNsis: true

      - name: Keep the unpublished bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            src-tauri/target.noindex/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target.noindex/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target.noindex/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target.noindex/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  # Only reached when every target built: a release missing an architecture is
  # worse than no release at all, and `needs` skips this job if any build failed.
  publish:
    needs: [draft, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const release_id = Number(${{ needs.draft.outputs.release_id }})
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              per_page: 100,
            })
            // Two macOS disk images and, per Windows architecture, an NSIS
            // installer and an MSI package; the macOS updater payloads come as their
            // own archive, one per architecture, each beside its signature.
            const expected = {
              '.dmg': 2,
              '.exe': 2,
              '.msi': 2,
              '.app.tar.gz': 2,
              '.app.tar.gz.sig': 2,
            }
            // Longest match wins, so `.app.tar.gz.sig` never counts as `.app.tar.gz`.
            const suffixes = Object.keys(expected).sort((a, b) => b.length - a.length)
            const found = Object.fromEntries(suffixes.map(suffix => [suffix, 0]))
            for (const asset of assets) {
              const suffix = suffixes.find(suffix => asset.name.endsWith(suffix))
              if (suffix) found[suffix] += 1
            }
            for (const [suffix, count] of Object.entries(expected)) {
              if (found[suffix] !== count) {
                throw new Error(`expected ${count} ${suffix} assets, found ${found[suffix]}`)
              }
            }

            // The manifest is what installed copies read, and a missing platform key
            // strands that architecture on its current version with no sign of trouble.
            const manifest = assets.find(asset => asset.name === 'latest.json')
            if (!manifest) throw new Error('the release has no latest.json')
            const { data: body } = await github.rest.repos.getReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: manifest.id,
              headers: { accept: 'application/octet-stream' },
            })
            const platforms = JSON.parse(Buffer.from(body).toString())?.platforms ?? {}
            for (const key of ['darwin-aarch64', 'darwin-x86_64', 'windows-x86_64', 'windows-aarch64']) {
              if (!platforms[key]?.url) throw new Error(`latest.json is missing ${key}`)
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              draft: false,
            })
