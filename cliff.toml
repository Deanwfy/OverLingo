# git-cliff configuration; scripts/release.sh regenerates CHANGELOG.md from this.

[changelog]
header = """
# Changelog

All notable changes to OverLingo are documented in this file."""
body = """
{%- if version %}
{%- if previous.version %}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Deanwfy/OverLingo/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- else %}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/Deanwfy/OverLingo/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{%- endif %}
{%- else %}
## [Unreleased]
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}"""
trim = false

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
# Groups render in prefix order; striptags hides the prefix in the output.
commit_parsers = [
  { message = "^chore: release", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  # A fix for a regression that never shipped, or work with nothing to show.
  { footer = "^Changelog: skip", skip = true },
  # No observable change by definition.
  { message = "^refactor", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = ".*", group = "<!-- 2 -->Chore" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
